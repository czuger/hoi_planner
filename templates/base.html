<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Planificateur HOI4{% endblock %}</title>
  <link rel="stylesheet" href="{{ prefix }}/static/app.css">
</head>
<body>
  <header>
    <h1>{% block heading %}Planificateur des focus nationaux allemands{% endblock %}</h1>
    {% block subtitle %}{% endblock %}
    <span class="grow"></span>
    <span class="db" title="DATABASE_URL choisit la base">{{ database_name }}</span>
  </header>

  {% for message in errors %}<div class="err">{{ message }}</div>{% endfor %}

  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
