[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4-planner"
version = "0.1.0"
description = "Plans the German national focus tree of Hearts of Iron IV, stored in a local MongoDB and edited in a small Flask UI."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "flask",
    "pymongo",
    "mongoengine",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # The models talk to an in-memory server in the tests, never to a mongod.
    "mongomock",
]
# Serving deps, installed only in production.
prod = [
    "gunicorn",
]

[tool.setuptools]
packages = ["core", "core.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `core` is a package at the root, the import script lives in scripts/ and the
# Flask app in api/ (whose own modules — app, queries, views — are imported by
# name), so all three roots have to be importable from tests.
pythonpath = [".", "scripts", "api"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
